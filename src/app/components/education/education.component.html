<div class="education-container">
    <h2>Education & Certifications</h2>

    <div class="section-block">
        <h3>Education</h3>
        <div class="card-list">
            <div class="card" *ngFor="let edu of educationList">
                <div class="card-header">
                    <h4>{{ edu.degree }}</h4>
                    <span class="duration">{{ edu.duration }}</span>
                </div>
                <h5>{{ edu.institution }}</h5>
                <p class="location">{{ edu.location }}</p>
                <ul class="details">
                    <li *ngFor="let detail of edu.details">{{ detail }}</li>
                </ul>
            </div>
        </div>
    </div>

    <div class="section-block">
        <h3>Certifications</h3>
        <div class="card-list">
            <div class="card" *ngFor="let cert of certifications">
                <h4>{{ cert.name }}</h4>
                <p class="issuer">{{ cert.issuer }}</p>
                <a *ngIf="cert.link" [href]="cert.link" target="_blank" class="cert-link">View Certificate</a>
            </div>
        </div>
    </div>
</div>
